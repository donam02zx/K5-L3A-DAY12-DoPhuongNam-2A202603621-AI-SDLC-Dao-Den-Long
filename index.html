<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    html, body { margin: 0; height: 100%; background: #120a1f; overflow: hidden; font-family: system-ui, sans-serif; }
    #hud { position: fixed; top: 12px; left: 12px; color: #ffd98a; font-size: 15px; line-height: 1.5;
           background: rgba(20, 10, 35, .55); padding: 10px 14px; border-radius: 10px; pointer-events: none; }
    #help { position: fixed; bottom: 12px; left: 12px; color: #cdb8e8; font-size: 13px; pointer-events: none; }
    #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); color: #ffe7b0; font-size: 18px;
             transition: opacity .4s; text-shadow: 0 0 8px #000; pointer-events: none; }
    #overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
               background: rgba(18, 10, 31, .75); color: #ffe7b0; text-align: center; font-size: 20px; }
    #overlay h1 { font-size: 56px; margin: 0 0 8px; color: #ffb347; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="help">WASD đi · Space nhảy · E nạp đèn · F / chuột trái tỏa sáng · ← → / kéo chuột phải xoay camera · R chơi lại</div>
  <div id="overlay"></div>
  <script type="module" src="/src/render/main.js"></script>
</body>
</html>
